# CharacterEngine configuration
# Format: name=value

window.title=CharacterEngine - Standalone D3D9
window.width=800
window.height=600
window.windowed=true
window.clearColor=0,0,255
#window.clearColor=32,24,48

paths.assetRoot=.
paths.mediaRoot=../media
paths.shaderRoot=shaders
paths.logFile=app.log

player.model=dragon
player.skin=default
player.weapon=railgun
player.weaponSkin=default
# Optional explicit overrides:
# player.modelPath=../media/dragon
# player.weaponPath=../media/railgun

render.shaderProfile=2
render.wireframe=false
render.showWeapon=false
render.moveLight=false

camera.zoom=-120.0
camera.fovDegrees=70.0
camera.nearPlane=1.0
camera.farPlane=1000.0

light.position=0,-10,40,1
